# Intégration continue : à chaque push sur main et à chaque pull request, deux jobs en parallèle.
# L'un vérifie le code (lint, format, types) et lance les tests unitaires et de la base ;
# l'autre lance les tests de bout en bout dans Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le workflow ne fait que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, types, tests unitaires et de la base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées sur un commit précis (et non un tag déplaçable) : Dependabot les met à jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
